name: zego_zimkit
description: A low-code plugin that provides a wrapper for IM widgets. Aims to simplify the development process by offering a user-friendly solution into applications.
version: 1.20.1
homepage: https://www.zegocloud.com/
screenshots:
  - description: "A full-featured chat kit that enables you to easily build one-on-one or group chat into your app in minutes."
    path: images/img_chat.png

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  zego_plugin_adapter: ^2.14.2
  zego_uikit_signaling_plugin: ^2.8.23
  zego_zim: ^3.2.0
  zego_zim_audio: ^1.0.0+1
  zego_zpns: ^2.8.0

  cached_network_image: ^4.0.4
  permission_handler: ^13.0.2
  encrypt: ^5.0.3
  flutter_logs_yoer: ^2.2.1
  async: ^2.0.0
  video_player: ^2.7.2
  file_picker: ^13.1.0
  chewie: ^1.10.0
  provider: ^6.0.5
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  plugin_platform_interface: ^2.1.8
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  import_sorter: ^4.6.0 # run 'flutter pub run import_sorter:main'
  lints: ^6.0.0

import_sorter:
  comments: false

flutter:
  uses-material-design: true
  plugin:
    platforms:
      android:
        package: com.zegocloud.uikit.zimkit_plugin
        pluginClass: ZegoUIKitZIMKitPlugin
      ios:
        pluginClass: ZegoUIKitZIMKitPlugin

linter:
  rules:
    public_member_api_docs: true
